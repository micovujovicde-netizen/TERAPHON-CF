
name: Unpack TERAPHON-CF package

on:
  push:
    branches: [main]
    paths:
      - 'TERAPHON_LICENSE_GITHUB_DEPLOY.zip'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: teraphon-cf-unpack
  cancel-in-progress: false

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Validate and unpack six TERAPHON files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          archive = Path('TERAPHON_LICENSE_GITHUB_DEPLOY.zip')
          if not archive.is_file():
              raise SystemExit('Upload TERAPHON_LICENSE_GITHUB_DEPLOY.zip to the repository root first.')
          expected = {
              '.github/workflows/teraphon-license-deploy.yml',
              'worker/README.md', 'worker/schema.sql',
              'worker/teraphon-license.js',
              'worker/test-payment-hooks.mjs',
              'worker/test-teraphon-worker.mjs',
          }
          with ZipFile(archive) as z:
              files = {i.filename for i in z.infolist() if not i.is_dir()}
              if files != expected:
                  raise SystemExit(f'Unexpected ZIP contents: {sorted(files ^ expected)}')
              if sum(i.file_size for i in z.infolist()) > 2_000_000:
                  raise SystemExit('Unexpected ZIP size; refusing to extract.')
              for name in sorted(expected):
                  target = Path(name)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(z.read(name))
          print('Verified and unpacked all six TERAPHON files.')
          PY

      - name: Commit unpacked source (never deploy automatically)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/teraphon-license-deploy.yml worker/
          if ! git diff --cached --quiet; then
            git commit -m 'Unpack TERAPHON license Worker source'
            git push origin HEAD:main
          else
            echo 'Files already up to date.'
          fi
          
