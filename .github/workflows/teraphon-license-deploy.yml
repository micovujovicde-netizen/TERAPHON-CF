name: TERAPHON - deploy license Worker

on:
  workflow_dispatch:
    inputs:
      d1_id:
        description: 'Database ID of existing teraphon-licenses D1'
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify code and prepare existing D1 binding
        shell: bash
        env:
          D1_ID: ${{ inputs.d1_id }}
        run: |
          set -euo pipefail
          [[ "$D1_ID" =~ ^[a-fA-F0-9]{8}-([a-fA-F0-9]{4}-){3}[a-fA-F0-9]{12}$ ]] || { echo 'Invalid D1 Database ID'; exit 1; }
          node --check worker/teraphon-license.js
          node worker/test-teraphon-worker.mjs
          node worker/test-payment-hooks.mjs
          cat > worker/wrangler.toml <<EOF
          name = "teraphon-license"
          main = "teraphon-license.js"
          compatibility_date = "2026-11-20"
          workers_dev = true
          [vars]
          BILLING_ENABLED = "false"
          TERA_PRODUCT_MONTHLY = "prod_g1lpJZPJbfKTkhr8qiqbn"
          TERA_PRODUCT_YEARLY = "prod_6cQTQHjizsAhj9BAkvJoIn"
          TERA_PRODUCT_LIFETIME = "prod_6fnL2AfTLkXb9WU1BYDZzL"
          [[d1_databases]]
          binding = "DB"
          database_name = "teraphon-licenses"
          database_id = "$D1_ID"
          EOF

      - name: Deploy TERAPHON only (billing OFF)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy
